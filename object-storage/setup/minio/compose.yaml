# MinIO（コミュニティ版）を単一ノード・単一ドライブで起動する
# 使い方: docker compose up -d --build / podman compose up -d --build
#
# 公式のビルド済みイメージは配布終了しているため，同じディレクトリの Dockerfile で
# 公式ソース（github.com/minio/minio）の固定タグをビルドしてから起動する．
# バージョンは MINIO_VERSION で変更できる（RELEASE.* 形式のタグ名）．
services:
  minio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MINIO_VERSION: ${MINIO_VERSION:-RELEASE.2025-10-15T17-29-55Z}
    # run.sh と同じタグにして，どちらで起動してもビルド済みイメージを共有する
    image: localhost/handbook-minio:${MINIO_VERSION:-RELEASE.2025-10-15T17-29-55Z}
    container_name: handbook-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_S3_PORT:-9000}:9000"      # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # Web コンソール
    volumes:
      - data:/data
    restart: unless-stopped

volumes:
  data:
    # run.sh と同じボリュームを使うため名前を固定する
    name: handbook-minio-data
